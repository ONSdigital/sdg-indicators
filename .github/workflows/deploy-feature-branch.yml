name: Deploy feature branch to S3

on:
  push:
    branches:
      - 'feature-*'

jobs:
  pre_job:
    runs-on: ubuntu-latest

    steps:
      - name: Cancel all existing duplicate workflows on branch
        uses: fkirc/skip-duplicate-actions@master
        with:
          skip_after_successful_duplicate: 'false'
          cancel_others: 'true'

  deploy:
    runs-on: ubuntu-latest

    env:
      JAWG_TOKEN: ${{ secrets.JAWG_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace Jawg token
        run: |
          sed -i "s/JAWG_TOKEN_PLACEHOLDER/${JAWG_TOKEN}/g" _data/site_config.yml

      - name: Set up Ruby 3.2
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Inject slug/short variables
        uses: rlespinasse/github-slug-action@v3.x

      - name: Update the baseurl
        uses: fjogeleit/yaml-update-action@master
        with:
          valueFile: '_config.yml'
          propertyPath: 'baseurl'
          value: '/${{ env.GITHUB_REF_SLUG }}'
          commitChange: 'false'
          updateFile: 'true'

      - name: Update the remote_data_prefix
        uses: fjogeleit/yaml-update-action@master
        if: startsWith(github.ref, 'refs/heads/feature-site-') == false
        with:
          valueFile: '_data/site_config.yml'
          propertyPath: 'remote_data_prefix'
          value: 'https://d2y2nq4o9b7i0o.cloudfront.net/${{ env.GITHUB_REF_SLUG }}-data'
          commitChange: 'false'
          updateFile: 'true'

      - name: Build the site
        run: |
          gem install bundler -v 2.4.22
          bundle config path vendor/bundle
          make install
          make build.staging

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET }}
          aws-region: eu-west-2

      - name: Deploy feature branch to S3
        run: |
          aws s3 sync _site/ "s3://uk-sdg-feature-branches/${{ env.GITHUB_REF_SLUG }}/" --delete --follow-symlinks

      - name: Send message to Slack channel
        uses: archive/github-actions-slack@v2.2.1
        id: notify
        with:
          slack-bot-user-oauth-access-token: ${{ secrets.SLACK_BOT_USER_OAUTH_ACCESS_TOKEN }}
          slack-channel: CP95DHDLY
          slack-text: 'Your feature branch is available at https://d2y2nq4o9b7i0o.cloudfront.net/${{ env.GITHUB_REF_SLUG }}'
